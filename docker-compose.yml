services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-richcrab}
      POSTGRES_USER: ${POSTGRES_USER:-richcrab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-richcrab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
      - ./richcrab/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-richcrab} -d ${POSTGRES_DB:-richcrab}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # gateway:
  #   build:
  #     context: ./defay1x9
  #     dockerfile: Dockerfile
  #   image: devhack/gateway:local
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     GW_LISTEN_HOST: "0.0.0.0"
  #     GW_LISTEN_PORT: "8080"
  #     GW_PUBLIC_BASE_URL: "http://localhost:8080"
  #     GW_OPENAPI_PATH: "./api/openapi.yaml"

  #     # CSRF cookie (доступен JS, чтобы положить в header)
  #     GW_CSRF_COOKIE_NAME: "XSRF-TOKEN"
  #     GW_CSRF_HEADER_NAME: "X-XSRF-TOKEN"
  #     GW_CSRF_COOKIE_SECURE: "false"
  #     GW_CSRF_COOKIE_HTTPONLY: "false"
  #     GW_CSRF_COOKIE_PATH: "/"

  #     # Session cookie (HttpOnly)
  #     GW_SESSION_COOKIE_NAME: "QB-SESSION"
  #     GW_SESSION_COOKIE_SECURE: "false"
  #     GW_SESSION_COOKIE_HTTPONLY: "true"
  #     GW_SESSION_COOKIE_PATH: "/"
  #     GW_SESSION_TTL_SECONDS: "86400"
  #   restart: unless-stopped

  entitlements:
    image: richcrabs/rust-backend:local
    pull_policy: build
    build: &rust_build
      context: .
      dockerfile: docker/rust-backend.Dockerfile
    working_dir: /app/richcrab
    volumes: &rust_volumes
      - ./:/app
      - cargo_target:/app/richcrab/target
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
    command: bash -lc "/usr/local/cargo/bin/cargo run -p entitlements"
    environment: &service_env
      DATABASE_URL: ${DATABASE_URL:-postgres://richcrab:richcrab@postgres:5432/richcrab}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-local-dev-encryption-key-change-me}
      TELEGRAM_WEBHOOK_BASE_URL: ${TELEGRAM_WEBHOOK_BASE_URL:-http://bot_ingress:8090}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_ADDR_GAME: ${SERVICE_ADDR_GAME:-0.0.0.0:50051}
      SERVICE_ADDR_JOIN: ${SERVICE_ADDR_JOIN:-0.0.0.0:50052}
      SERVICE_ADDR_QUIZ: ${SERVICE_ADDR_QUIZ:-0.0.0.0:50053}
      SERVICE_ADDR_ENTITLEMENTS: ${SERVICE_ADDR_ENTITLEMENTS:-0.0.0.0:50054}
      SERVICE_ADDR_BOT: ${SERVICE_ADDR_BOT:-0.0.0.0:50055}
      SERVICE_ADDR_BOT_INGRESS: ${SERVICE_ADDR_BOT_INGRESS:-0.0.0.0:8090}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "50054:50054"

  game:
    image: richcrabs/rust-backend:local
    pull_policy: build
    build: *rust_build
    working_dir: /app/richcrab
    volumes: *rust_volumes
    command: bash -lc "/usr/local/cargo/bin/cargo run -p game"
    environment: *service_env
    depends_on:
      entitlements:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "50051:50051"

  join:
    image: richcrabs/rust-backend:local
    pull_policy: build
    build: *rust_build
    working_dir: /app/richcrab
    volumes: *rust_volumes
    command: bash -lc "/usr/local/cargo/bin/cargo run -p join"
    environment: *service_env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "50052:50052"

  quiz:
    image: richcrabs/rust-backend:local
    pull_policy: build
    build: *rust_build
    working_dir: /app/richcrab
    volumes: *rust_volumes
    command: bash -lc "/usr/local/cargo/bin/cargo run -p quiz"
    environment: *service_env
    depends_on:
      entitlements:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "50053:50053"

  bot:
    image: richcrabs/rust-backend:local
    pull_policy: build
    build: *rust_build
    working_dir: /app/richcrab
    volumes: *rust_volumes
    command: bash -lc "/usr/local/cargo/bin/cargo run -p bot"
    environment: *service_env
    depends_on:
      entitlements:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "50055:50055"

  bot_ingress:
    image: richcrabs/rust-backend:local
    pull_policy: build
    build: *rust_build
    working_dir: /app/richcrab
    volumes: *rust_volumes
    command: bash -lc "/usr/local/cargo/bin/cargo run -p bot_ingress"
    environment: *service_env
    depends_on:
      game:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "8090:8090"

volumes:
  pg_data:
  cargo_target:
  cargo_registry:
  cargo_git: