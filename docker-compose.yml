services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: richcrab
      POSTGRES_USER: richcrab
      POSTGRES_PASSWORD: richcrab
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  entitlements:
    image: rust:1.84
    working_dir: /app/richcrab
    volumes:
      - ./:/app
    command: bash -lc "cargo run -p entitlements"
    environment: &service_env
      DATABASE_URL: postgres://richcrab:richcrab@postgres:5432/richcrab
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: local-dev-encryption-key
      TELEGRAM_WEBHOOK_BASE_URL: http://bot_ingress:8090
      LOG_LEVEL: info
      SERVICE_ADDR_GAME: 0.0.0.0:50051
      SERVICE_ADDR_JOIN: 0.0.0.0:50052
      SERVICE_ADDR_QUIZ: 0.0.0.0:50053
      SERVICE_ADDR_ENTITLEMENTS: 0.0.0.0:50054
      SERVICE_ADDR_BOT: 0.0.0.0:50055
      SERVICE_ADDR_BOT_INGRESS: 0.0.0.0:8090
    depends_on:
      - postgres
      - redis
    ports:
      - "50054:50054"

  game:
    image: rust:1.84
    working_dir: /app/richcrab
    volumes:
      - ./:/app
    command: bash -lc "cargo run -p game"
    environment: *service_env
    depends_on:
      - entitlements
      - redis
    ports:
      - "50051:50051"

  join:
    image: rust:1.84
    working_dir: /app/richcrab
    volumes:
      - ./:/app
    command: bash -lc "cargo run -p join"
    environment: *service_env
    depends_on:
      - redis
    ports:
      - "50052:50052"

  quiz:
    image: rust:1.84
    working_dir: /app/richcrab
    volumes:
      - ./:/app
    command: bash -lc "cargo run -p quiz"
    environment: *service_env
    depends_on:
      - entitlements
      - postgres
    ports:
      - "50053:50053"

  bot:
    image: rust:1.84
    working_dir: /app/richcrab
    volumes:
      - ./:/app
    command: bash -lc "cargo run -p bot"
    environment: *service_env
    depends_on:
      - entitlements
      - postgres
    ports:
      - "50055:50055"

  bot_ingress:
    image: rust:1.84
    working_dir: /app/richcrab
    volumes:
      - ./:/app
    command: bash -lc "cargo run -p bot_ingress"
    environment: *service_env
    depends_on:
      - game
      - postgres
    ports:
      - "8090:8090"

volumes:
  pg_data:
