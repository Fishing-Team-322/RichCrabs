[package]
name = "bot"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
shared = { path = "../../shared" }
proto = { path = "../../proto" }
chrono.workspace = true
serde_json.workspace = true
sqlx.workspace = true
uuid.workspace = true
tonic = { version = "0.12", features = ["transport"] }
