syntax = "proto3";

package richcrab.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

message RoomId {
  string value = 1;
}

message UserId {
  string value = 1;
}

message PlayerId {
  string value = 1;
}

message QuizId {
  string value = 1;
}

message BotId {
  string value = 1;
}

message Error {
  string code = 1;
  string message = 2;
  repeated string details = 3;
  google.protobuf.Timestamp occurred_at = 4;
  optional google.protobuf.Duration retry_after = 5;
}
