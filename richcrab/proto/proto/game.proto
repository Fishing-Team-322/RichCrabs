syntax = "proto3";

package richcrab.v1;

import "common.proto";
import "events.proto";
import "google/protobuf/timestamp.proto";

service GameService {
  rpc CreateRoom(CreateRoomRequest) returns (CreateRoomResponse);
  rpc RegenerateInvite(RegenerateInviteRequest) returns (RegenerateInviteResponse);
  rpc JoinRoom(JoinRoomRequest) returns (JoinRoomResponse);
  rpc LeaveRoom(LeaveRoomRequest) returns (LeaveRoomResponse);
  rpc KickPlayer(KickPlayerRequest) returns (KickPlayerResponse);
  rpc StartGame(StartGameRequest) returns (StartGameResponse);
  rpc PauseGame(PauseGameRequest) returns (PauseGameResponse);
  rpc ResumeGame(ResumeGameRequest) returns (ResumeGameResponse);
  rpc NextQuestion(NextQuestionRequest) returns (NextQuestionResponse);
  rpc SubmitAnswer(SubmitAnswerRequest) returns (SubmitAnswerResponse);
  rpc PostChatMessage(PostChatMessageRequest) returns (PostChatMessageResponse);
  rpc GetRoomChatMessages(GetRoomChatMessagesRequest) returns (GetRoomChatMessagesResponse);
  rpc SubscribeRoomEvents(SubscribeRoomEventsRequest) returns (stream RoomEvent);
  rpc GetRoomState(GetRoomStateRequest) returns (GetRoomStateResponse);
  rpc ListRooms(ListRoomsRequest) returns (ListRoomsResponse);
}


message RoomTimers {
  uint32 lobby_timer_sec = 1;
  uint32 question_timer_sec = 2;
  uint32 answer_reveal_sec = 3;
}

enum RoomVisibility {
  ROOM_VISIBILITY_UNSPECIFIED = 0;
  ROOM_VISIBILITY_PRIVATE = 1;
  ROOM_VISIBILITY_PUBLIC = 2;
}

message RoomSettings {
  uint32 player_limit = 1;
  RoomVisibility visibility = 2;
  RoomTimers timers = 3;
}

message ListRoomsRequest {
  UserId owner_user_id = 1;
  uint32 limit = 2;
  bool include_public = 3;
}

message RoomSnapshot {
  RoomId room_id = 1;
  string pin = 2;
  UserId owner_user_id = 3;
  QuizId quiz_id = 4;
  string title = 5;
  string state = 6;
  repeated PlayerState players = 7;
  google.protobuf.Timestamp updated_at = 8;
  string invite_path = 9;
  RoomSettings settings = 10;
}

message ListRoomsResponse {
  repeated RoomSnapshot rooms = 1;
  optional Error error = 2;
}

message ChatMessage {
  string message_id = 1;
  RoomId room_id = 2;
  string author = 3;
  string body = 4;
  google.protobuf.Timestamp created_at = 5;
}

message PostChatMessageRequest {
  RoomId room_id = 1;
  oneof author {
    PlayerId player_id = 2;
    UserId user_id = 3;
  }
  string body = 4;
}

message PostChatMessageResponse {
  ChatMessage message = 1;
  optional Error error = 2;
}

message GetRoomChatMessagesRequest {
  RoomId room_id = 1;
  uint32 limit = 2;
}

message GetRoomChatMessagesResponse {
  repeated ChatMessage messages = 1;
  optional Error error = 2;
}

message RegenerateInviteRequest {
  RoomId room_id = 1;
  UserId requested_by = 2;
}

message RegenerateInviteResponse {
  string invite_token = 1;
  string invite_path = 2;
  string invite_qr_svg = 3;
  optional Error error = 4;
}

message CreateRoomRequest {
  UserId owner_user_id = 1;
  QuizId quiz_id = 2;
  string title = 3;
  RoomSettings settings = 4;
}

message CreateRoomResponse {
  RoomId room_id = 1;
  string pin = 2;
  string invite_token = 3;
  google.protobuf.Timestamp created_at = 4;
  optional Error error = 5;
  string invite_path = 6;
  string invite_qr_svg = 7;
  RoomSettings settings = 8;
}

message JoinRoomRequest {
  string join_ticket = 1;
}

message JoinRoomResponse {
  PlayerId player_id = 1;
  google.protobuf.Timestamp joined_at = 2;
  optional Error error = 3;
}

message LeaveRoomRequest {
  RoomId room_id = 1;
  PlayerId player_id = 2;
}

message LeaveRoomResponse {
  bool left = 1;
  optional Error error = 2;
}

message KickPlayerRequest {
  RoomId room_id = 1;
  UserId requested_by = 2;
  PlayerId player_id = 3;
}

message KickPlayerResponse {
  bool kicked = 1;
  optional Error error = 2;
}

message StartGameRequest {
  RoomId room_id = 1;
  UserId requested_by = 2;
}

message StartGameResponse {
  bool started = 1;
  google.protobuf.Timestamp started_at = 2;
  optional Error error = 3;
}

message PauseGameRequest {
  RoomId room_id = 1;
  UserId requested_by = 2;
}

message PauseGameResponse {
  bool paused = 1;
  optional Error error = 2;
}

message ResumeGameRequest {
  RoomId room_id = 1;
  UserId requested_by = 2;
}

message ResumeGameResponse {
  bool resumed = 1;
  optional Error error = 2;
}

message NextQuestionRequest {
  RoomId room_id = 1;
  UserId requested_by = 2;
}

message NextQuestionResponse {
  bool advanced = 1;
  optional Error error = 2;
}

message SubmitAnswerRequest {
  RoomId room_id = 1;
  PlayerId player_id = 2;
  string question_id = 3;
  string answer = 4;
  google.protobuf.Timestamp submitted_at = 5;
}

message SubmitAnswerResponse {
  bool accepted = 1;
  uint32 score_delta = 2;
  optional Error error = 3;
}

message SubscribeRoomEventsRequest {
  RoomId room_id = 1;
  PlayerId subscriber_player_id = 2;
}

message GetRoomStateRequest {
  RoomId room_id = 1;
}

message TeamState {
  string team_id = 1;
  uint32 score = 2;
  repeated PlayerId players = 3;
}

message PlayerState {
  PlayerId player_id = 1;
  string display_name = 2;
  uint32 score = 3;
  optional string team_id = 4;
}

message QuestionState {
  string question_id = 1;
  string question_text = 2;
  repeated string options = 3;
  optional google.protobuf.Timestamp ends_at = 4;
}

message GetRoomStateResponse {
  RoomId room_id = 1;
  string state = 2;
  repeated PlayerState players = 3;
  optional string current_question_id = 4;
  google.protobuf.Timestamp updated_at = 5;
  optional Error error = 6;
  repeated TeamState teams = 7;
  optional QuestionState current_question = 8;
  string pin = 9;
  QuizId quiz_id = 10;
  UserId owner_user_id = 11;
  string title = 12;
  string invite_path = 13;
  RoomSettings settings = 14;
}
