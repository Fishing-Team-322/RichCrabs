name: Docker publish (GHCR)

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            {
              echo "rust_tags<<EOF"
              echo "${REGISTRY}/${OWNER}/richcrabs-rust-backend:${TAG}"
              echo "${REGISTRY}/${OWNER}/richcrabs-rust-backend:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            {
              echo "gateway_tags<<EOF"
              echo "${REGISTRY}/${OWNER}/richcrabs-gateway:${TAG}"
              echo "${REGISTRY}/${OWNER}/richcrabs-gateway:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            TAG="sha-${GITHUB_SHA::7}"
            echo "rust_tags=${REGISTRY}/${OWNER}/richcrabs-rust-backend:${TAG}" >> "$GITHUB_OUTPUT"
            echo "gateway_tags=${REGISTRY}/${OWNER}/richcrabs-gateway:${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push rust-backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/rust-backend.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.rust_tags }}
          cache-from: type=gha,scope=rust-backend
          cache-to: type=gha,mode=max,scope=rust-backend

      - name: Build & push gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: defay1x9/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.gateway_tags }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway