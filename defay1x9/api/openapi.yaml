        Client message types: `ping`, `start_game`, `pause_game`, `resume_game`, `next_question`, `submit_answer`, `get_state`.
        Server message types: `hello`, `room_event`, `room_state`, `error`, `pong`, `start_game_result`, `pause_game_result`, `resume_game_result`, `next_question_result`.

        Client -> Server schema: `WsClientMessage`
        Server -> Client schema: `WsServerMessage`
      responses:
        '101':
          description: Switching Protocols
      x-websocket-messages:
        clientToServer:
          $ref: '#/components/schemas/WsClientMessage'
        serverToClient:
          $ref: '#/components/schemas/WsServerMessage'
