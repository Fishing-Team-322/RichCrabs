openapi: 3.1.0
info:
  title: QuizBattle Gateway API
  version: 0.1.0
servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: QB-SESSION
  schemas:
    JoinRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
    CreateGameRequest:
      type: object
      required: [ownerUserId, quizId, title]
      properties:
        ownerUserId: { type: string, minLength: 1, maxLength: 120 }
        quizId: { type: string, minLength: 1, maxLength: 120 }
        title: { type: string, minLength: 1, maxLength: 200 }
    CreateGameResponse:
      type: object
      required: [pin, inviteToken, inviteUrl, wsUrl]
      properties:
        pin: { type: string, pattern: "^[A-Z0-9]{6}$" }
        inviteToken: { type: string }
        inviteUrl: { type: string }
        wsUrl: { type: string }
    JoinResponse:
      type: object
      required: [playerId, team, role, wsUrl]
      properties:
        playerId: { type: string }
        team: { type: string, enum: [A, B] }
        role: { type: string, enum: [player] }
        wsUrl: { type: string }
    RegisterBotRequest:
      type: object
      required: [name, version, endpoint]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        version: { type: string, minLength: 1, maxLength: 120 }
        endpoint: { type: string, minLength: 1, maxLength: 300 }
    Bot:
      type: object
      required: [botId, name, version, status, registeredAt]
      properties:
        botId: { type: string }
        name: { type: string }
        version: { type: string }
        status: { type: string }
        registeredAt:
          type: integer
          format: int64
    RegisterBotResponse:
      type: object
      required: [bot]
      properties:
        bot:
          $ref: '#/components/schemas/Bot'
    ListBotsResponse:
      type: object
      required: [bots]
      properties:
        bots:
          type: array
          items:
            $ref: '#/components/schemas/Bot'
    GetBotResponse:
      type: object
      required: [bot]
      properties:
        bot:
          $ref: '#/components/schemas/Bot'

paths:
  /health:
    get:
      summary: Healthcheck
      responses:
        "200": { description: OK }

  /openapi.yaml:
    get:
      summary: OpenAPI schema
      responses:
        "200": { description: OK }

  /docs:
    get:
      summary: Swagger UI
      responses:
        "200": { description: OK }

  /api/v1/games:
    post:
      summary: Create game room and host session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameRequest'
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGameResponse'

  /api/v1/games/{pin}/join:
    post:
      summary: Join by PIN
      parameters:
        - name: pin
          in: path
          required: true
          schema: { type: string, pattern: "^[A-Z0-9]{6}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequest'
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinResponse'

  /api/v1/invites/{inviteToken}/join:
    post:
      summary: Join by invite token
      parameters:
        - name: inviteToken
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequest'
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinResponse'

  /api/v1/games/{pin}/start:
    post:
      summary: Start game (host only)
      security:
        - cookieAuth: []
      parameters:
        - name: pin
          in: path
          required: true
          schema: { type: string, pattern: "^[A-Z0-9]{6}$" }
      responses:
        "204": { description: Started }

  /api/v1/bots:
    post:
      summary: Register bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBotRequest'
      responses:
        "200":
          description: Bot registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterBotResponse'
        "400": { description: Invalid argument }
        "403": { description: Permission denied }
        "409": { description: Failed precondition }
        "503": { description: Bot service unavailable }
    get:
      summary: List bots
      responses:
        "200":
          description: Bots list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBotsResponse'
        "403": { description: Permission denied }
        "503": { description: Bot service unavailable }

  /api/v1/bots/{botId}:
    get:
      summary: Get bot status
      parameters:
        - name: botId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Bot details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBotResponse'
        "400": { description: Invalid argument }
        "403": { description: Permission denied }
        "409": { description: Failed precondition }
        "503": { description: Bot service unavailable }
    delete:
      summary: Remove bot
      parameters:
        - name: botId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "204": { description: Bot removed }
        "400": { description: Invalid argument }
        "403": { description: Permission denied }
        "409": { description: Failed precondition }
        "503": { description: Bot service unavailable }
