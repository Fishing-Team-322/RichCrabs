openapi: 3.1.0
info:
  title: QuizBattle Gateway API
  version: 0.3.0
  description: HTTP and WebSocket contract for gateway, gameplay, auth, profile, bots and admin APIs.
servers:
  - url: http://localhost:8080

tags:
  - name: Service
    description: Service and documentation endpoints.
  - name: Games
    description: Room lifecycle and gameplay endpoints.
  - name: Invites
    description: Join and invite flows.
  - name: WebSocket
    description: Real-time channel and message contracts.
  - name: Bots
    description: Bot management APIs.
  - name: Quizzes
    description: Quiz authoring and publishing APIs.
  - name: Telegram
    description: Telegram bot connect and webhook ingress APIs.
  - name: Admin
    description: Administrative endpoints under /admin/api/*.
  - name: Auth
    description: Registration, login, logout and CSRF endpoints.
  - name: Profile
    description: Current user profile and password management.
  - name: Session
    description: Active session information.

x-tagGroups:
  - name: Platform
    tags:
      - Service
      - Session
      - WebSocket
  - name: Identity
    tags:
      - Auth
      - Profile
  - name: Gameplay
    tags:
      - Games
      - Invites
      - Quizzes
  - name: Integrations
    tags:
      - Telegram
      - Bots
  - name: Operations
    tags:
      - Admin

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: QB-SESSION
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN

  schemas:
    ErrorDetail:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
          example: email
        reason:
          type: string
          example: invalid_format

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum:
            - invalid_json
            - validation_error
            - unauthorized
            - csrf_required
            - forbidden
            - not_found
            - email_taken
            - too_many_attempts
            - not_implemented
            - grpc_unavailable
            - grpc_timeout
          example: validation_error
        message:
          type: string
          example: request validation failed
        details:
          description: Optional structured details (object or array).
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
      examples:
        validation:
          value:
            error: validation_error
            message: request validation failed
            details:
              - field: email
                reason: invalid_format
        forbidden:
          value:
            error: csrf_required
            message: csrf token mismatch
        grpcUnavailable:
          value:
            error: grpc_unavailable
            message: "grpc unavailable: get_room_state"
        notFound:
          value:
            error: not_found
            message: bot_id does not exist

    HealthResponse:
      type: object
      required: [status, gateway]
      properties:
        status:
          type: string
          example: ok
        gateway:
          type: string
          example: ok
        requestId:
          type: string
          example: 0123456789abcdef0123456789abcdef

    CsrfResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          example: csrf-token-123

    SessionResponse:
      type: object
      required: [authenticated, role]
      properties:
        authenticated:
          type: boolean
          example: true
        role:
          type: string
          example: host
        userId:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000001
        roomId:
          type: string
          example: room-1
        pin:
          type: string
          example: ABC123
        playerId:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
        exp:
          type: integer
          format: int64
          example: 1730000000

    UserProfile:
      type: object
      required: [id, email, displayName]
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000001
        email:
          type: string
          format: email
          example: alice@example.com
        displayName:
          type: string
          example: Alice

    UpdateProfileRequest:
      type: object
      anyOf:
        - required: [displayName]
        - required: [avatarUrl]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          example: Alice Cooper
        avatarUrl:
          type: string
          format: uri
          example: https://cdn.example.com/avatars/alice.png

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          example: oldPass123
        newPassword:
          type: string
          format: password
          minLength: 8
          example: newPass123!

    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: Passw0rd!
        displayName:
          type: string
          example: Alice

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          format: password
          example: Passw0rd!

    AuthResponse:
      type: object
      required: [user, csrfToken]
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
        csrfToken:
          type: string
          example: csrf-token-123

    CreateGameRequest:
      type: object
      required: [ownerUserId, quizId, title]
      properties:
        ownerUserId:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000001
        quizId:
          type: string
          minLength: 1
          maxLength: 120
          example: demo-quiz
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Friday Quiz

    CreateGameResponse:
      type: object
      required: [pin, inviteToken, inviteUrl, wsUrl]
      properties:
        pin:
          type: string
          pattern: '^[A-Z0-9]{6}$'
          example: ABC123
        inviteToken:
          type: string
          example: token123
        inviteUrl:
          type: string
          example: http://localhost:8080/join?inviteToken=token123
        wsUrl:
          type: string
          example: ws://localhost:8080/ws

    JoinRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          example: Alice

    JoinResponse:
      type: object
      required: [playerId, team, role, wsUrl]
      properties:
        playerId:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
        team:
          type: string
          enum: [A, B]
          example: A
        role:
          type: string
          enum: [player]
          example: player
        wsUrl:
          type: string
          example: ws://localhost:8080/ws
        csrfToken:
          type: string
          example: csrf-token-123

    GameStateResponse:
      type: object
      required: [pin, state]
      properties:
        pin:
          type: string
          example: ABC123
        state:
          type: string
          example: lobby
        players:
          type: array
          items:
            type: object
            properties:
              playerId:
                type: string
                example: 123e4567-e89b-12d3-a456-426614174000
              name:
                type: string
                example: Alice
              score:
                type: integer
                example: 0

    RegisterBotRequest:
      type: object
      required: [name, version, endpoint]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Demo Bot
        version:
          type: string
          minLength: 1
          maxLength: 120
          example: 1.0.0
        endpoint:
          type: string
          minLength: 1
          maxLength: 300
          example: https://bot.example.com/webhook

    UpdateBotRequest:
      type: object
      properties:
        name:
          type: string
          example: Demo Bot v2
        enabled:
          type: boolean
          example: true
        metadata:
          type: object
          additionalProperties: true
          example:
            channel: telegram
            locale: ru

    Bot:
      type: object
      required: [botId, name, version, status, registeredAt, enabled, metadata]
      properties:
        botId:
          type: string
          example: bot_1
        name:
          type: string
          example: Demo Bot
        version:
          type: string
          example: 1.0.0
        status:
          type: string
          example: active
        registeredAt:
          type: integer
          format: int64
          example: 1730000000
        enabled:
          type: boolean
          example: true
        metadata:
          type: object
          additionalProperties: true
          example: {}

    BotResponse:
      type: object
      required: [bot]
      properties:
        bot:
          $ref: '#/components/schemas/Bot'

    ListBotsResponse:
      type: object
      required: [bots]
      properties:
        bots:
          type: array
          items:
            $ref: '#/components/schemas/Bot'

    AdminStatsResponse:
      type: object
      required: [usersCount, gamesCount, activeRooms]
      properties:
        usersCount:
          type: integer
          example: 1024
        gamesCount:
          type: integer
          example: 2048
        activeRooms:
          type: integer
          example: 32

    AdminUserActionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          example: abuse report #42

    WsClientMessage:
      oneOf:
        - $ref: '#/components/schemas/WsClientPing'
        - $ref: '#/components/schemas/WsClientStartGame'
        - $ref: '#/components/schemas/WsClientPauseGame'
        - $ref: '#/components/schemas/WsClientResumeGame'
        - $ref: '#/components/schemas/WsClientNextQuestion'
        - $ref: '#/components/schemas/WsClientGetState'
        - $ref: '#/components/schemas/WsClientSubmitAnswer'
      discriminator:
        propertyName: type

    WsServerMessage:
      oneOf:
        - $ref: '#/components/schemas/WsServerHello'
        - $ref: '#/components/schemas/WsServerRoomEvent'
        - $ref: '#/components/schemas/WsServerRoomState'
        - $ref: '#/components/schemas/WsServerPong'
        - $ref: '#/components/schemas/WsServerStartGameResult'
        - $ref: '#/components/schemas/WsServerPauseGameResult'
        - $ref: '#/components/schemas/WsServerResumeGameResult'
        - $ref: '#/components/schemas/WsServerNextQuestionResult'
        - $ref: '#/components/schemas/WsServerError'
      discriminator:
        propertyName: type


    QuizQuestion:
      type: object
      required: [text, options, correctIndex]
      properties:
        id:
          type: string
        text:
          type: string
        options:
          type: array
          items:
            type: string
        correctIndex:
          type: integer
        timeLimitSec:
          type: integer

    Quiz:
      type: object
      required: [quizId, ownerUserId, title, published, questions]
      properties:
        quizId:
          type: string
        ownerUserId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        published:
          type: boolean
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuizQuestion'

    QuizResponse:
      type: object
      required: [quiz]
      properties:
        quiz:
          $ref: '#/components/schemas/Quiz'

    QuizListResponse:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Quiz'
        limit:
          type: integer
        offset:
          type: integer

    CreateQuizRequest:
      type: object
      required: [title, questions]
      properties:
        ownerUserId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuizQuestion'

    UpdateQuizRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuizQuestion'

    TelegramConnectRequest:
      type: object
      required: [botToken]
      properties:
        botToken:
          type: string
        name:
          type: string

    TelegramConnectResponse:
      type: object
      required: [botId, webhookUrl, status]
      properties:
        botId:
          type: string
        webhookUrl:
          type: string
        status:
          type: string

    QuizTelegramDegradedResponse:
      type: object
      required: [status, code, note, details]
      properties:
        status:
          type: string
          enum: [degraded]
        code:
          type: string
          example: not_implemented_in_rust
        note:
          type: string
          example: quiz rpc unavailable
        details:
          type: object
          additionalProperties: true

    QuizTelegramErrorResponse:
      type: object
      required: [status, code, note, details]
      properties:
        status:
          type: string
          enum: [error]
        code:
          type: string
          example: validation_error
        note:
          type: string
          example: request validation failed
        details:
          type: object
          additionalProperties: true

    LimitExceededDetails:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [limit_exceeded]
        limit:
          type: string
          example: AI_GENERATE
        retryAt:
          type: string
          format: date-time
          example: '2026-01-01T00:00:00Z'

    LimitExceededResponse:
      type: object
      required: [error, message, details]
      properties:
        error:
          type: string
          enum: [too_many_attempts, forbidden]
          example: too_many_attempts
        message:
          type: string
          example: ai limit exceeded
        details:
          $ref: '#/components/schemas/LimitExceededDetails'

    EntitlementLimit:
      type: object
      required: [limit, used, max]
      properties:
        limit:
          type: string
          example: ai
        used:
          type: integer
          minimum: 0
        max:
          type: integer
          minimum: 0
        retryAt:
          type: string
          format: date-time

    EntitlementsResponse:
      type: object
      required: [limits, byLimit]
      properties:
        limits:
          type: array
          items:
            $ref: '#/components/schemas/EntitlementLimit'
        byLimit:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EntitlementLimit'

    UsageResponse:
      type: object
      required: [usage]
      properties:
        usage:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        periodEndsAt:
          type: string
          format: date-time

    AiGenerateRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          example: История Древнего Рима
        desiredQuestionCount:
          type: integer
          minimum: 1
          example: 7
        difficulty:
          type: string
          enum: [easy, medium, hard]
          example: medium
        language:
          type: string
          example: ru
        format:
          type: string
          enum: [single, multi]
          example: single
      examples:
        minimal:
          value:
            prompt: История Древнего Рима
        full:
          value:
            prompt: История Древнего Рима
            desiredQuestionCount: 7
            difficulty: medium
            language: ru
            format: single

    AiGenerateAcceptedResponse:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [queued, running, done, failed]

    AiJobStatusResponse:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [queued, running, done, failed]
        quiz:
          $ref: '#/components/schemas/Quiz'
        errorCode:
          type: string
        errorMessage:
          type: string

    AiJobResultResponse:
      type: object
      required: [jobId, status, quiz]
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [done]
        quiz:
          $ref: '#/components/schemas/Quiz'

    WsClientPauseGame:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: pause_game

    WsClientResumeGame:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: resume_game

    WsClientNextQuestion:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: next_question

    WsClientPing:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: ping
      example:
        type: ping

    WsClientStartGame:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: start_game
        request_id:
          type: string
          description: Optional client request id.
      example:
        type: start_game
        request_id: ccc0f7f4b89a4f41a4f80d1fb3809dcf

    WsClientGetState:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: get_state
        request_id:
          type: string
      example:
        type: get_state

    WsClientSubmitAnswer:
      type: object
      required: [type, question_id, answer]
      properties:
        type:
          type: string
          const: submit_answer
        request_id:
          type: string
        question_id:
          type: string
          example: q-1
        answer:
          type: string
          example: 42
      example:
        type: submit_answer
        question_id: q-1
        answer: 42

    WsServerHello:
      type: object
      required: [type, roomId, role]
      properties:
        type:
          type: string
          const: hello
        roomId:
          type: string
          example: room-1
        role:
          type: string
          example: player
      example:
        type: hello
        roomId: room-1
        role: player

    WsServerRoomEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: room_event
        event:
          type: object
          additionalProperties: true
        event_raw:
          type: string
      example:
        type: room_event
        event:
          kind: question_opened
          question_id: q-1

    WsServerRoomState:
      type: object
      required: [type, room_id, state, players]
      properties:
        type:
          type: string
          const: room_state
        room_id:
          type: string
          example: room-1
        state:
          type: string
          example: in_progress
        current_question_id:
          type: string
          example: q-1
        players:
          type: array
          items:
            type: object
            required: [player_id, display_name, score]
            properties:
              player_id:
                type: string
              display_name:
                type: string
              score:
                type: integer
      example:
        type: room_state
        room_id: room-1
        state: in_progress
        players:
          - player_id: p1
            display_name: Alice
            score: 10

    WsServerPong:
      type: object
      required: [type]
      properties:
        type:
          type: string
          const: pong
      example:
        type: pong

    WsServerStartGameResult:
      type: object
      required: [type, started]
      properties:
        type:
          type: string
          const: start_game_result
        started:
          type: boolean

    WsServerPauseGameResult:
      type: object
      required: [type, paused]
      properties:
        type:
          type: string
          const: pause_game_result
        paused:
          type: boolean

    WsServerResumeGameResult:
      type: object
      required: [type, resumed]
      properties:
        type:
          type: string
          const: resume_game_result
        resumed:
          type: boolean

    WsServerNextQuestionResult:
      type: object
      required: [type, advanced]
      properties:
        type:
          type: string
          const: next_question_result
        advanced:
          type: boolean

    WsServerError:
      type: object
      required: [type, error, message]
      properties:
        type:
          type: string
          const: error
        error:
          type: string
          example: get_state_failed
        message:
          type: string
          example: get_state rpc failed
        details:
          description: Optional structured details.
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items:
                type: object
                additionalProperties: true
      example:
        type: error
        error: get_state_failed
        message: get_state rpc failed
        details:
          grpc_code: 14
          grpc_message: unavailable

paths:
  /health:
    get:
      tags: [Service]
      summary: Gateway health check
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /openapi.yaml:
    get:
      tags: [Service]
      summary: OpenAPI schema document
      responses:
        '200':
          description: OpenAPI YAML

  /docs:
    get:
      tags: [Service]
      summary: Swagger UI page
      responses:
        '200':
          description: HTML documentation page

  /csrf:
    get:
      tags: [Service]
      summary: Issue CSRF token (legacy alias)
      deprecated: true
      responses:
        '200':
          description: CSRF token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'

  /logout:
    post:
      tags: [Service]
      summary: Logout from service endpoint (legacy alias)
      deprecated: true
      security:
        - sessionCookie: []
        - csrfHeader: []
      responses:
        '204':
          description: Logged out and cookies cleared
        '403':
          description: CSRF token mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/session:
    get:
      tags: [Session]
      summary: Get current session
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current session data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: Missing or invalid session

  /api/v1/entitlements:
    get:
      tags: [Service]
      summary: Get current user entitlement limits and usage
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Entitlement limits snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementsResponse'
        '5xx':
          description: Backend/internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/usage:
    get:
      tags: [Service]
      summary: Get current user feature usage counters
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Usage snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
        '5xx':
          description: Backend/internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/me:
    get:
      tags: [Profile]
      summary: Get current profile
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
    patch:
      tags: [Profile]
      summary: Update current profile
      security:
        - sessionCookie: []
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            examples:
              update:
                value:
                  displayName: Alice Cooper
                  avatarUrl: https://cdn.example.com/avatars/alice.png
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'

  /api/v1/me/password:
    post:
      tags: [Profile]
      summary: Change current user password
      security:
        - sessionCookie: []
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            examples:
              default:
                value:
                  currentPassword: oldPass123
                  newPassword: newPass123!
      responses:
